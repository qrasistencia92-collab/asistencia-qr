<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia QR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 2px solid #38bdf8; }
    .box-estado { min-height: 55px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; border-radius: 12px; }
  </style>
</head>
<body class="p-3">

<div class="container" style="max-width: 550px;">

  <!-- PANTALLA 1: LOGIN -->
  <div id="vista-login" class="card card-custom p-4 mt-3">
    <h3 class="text-center text-info mb-2 fw-bold">Asistencia Escolar</h3>
    <p class="text-center text-secondary small mb-4">Seleccione su rol para ingresar</p>
    
    <div class="btn-group w-100 mb-4" role="group">
      <input type="radio" class="btn-check" name="btnRol" id="rolRegente" checked onclick="toggleRol('regente')">
      <label class="btn btn-outline-info" for="rolRegente">Regente</label>

      <input type="radio" class="btn-check" name="btnRol" id="rolEstudiante" onclick="toggleRol('estudiante')">
      <label class="btn btn-outline-info" for="rolEstudiante">Estudiante</label>
    </div>

    <!-- Login Regente -->
    <div id="form-regente">
      <div class="mb-3">
        <label class="form-label text-light">Usuario</label>
        <input type="text" id="logUsuario" class="form-control bg-dark text-white border-secondary" placeholder="Ej: regente1">
      </div>
      <div class="mb-3">
        <label class="form-label text-light">Contraseña</label>
        <input type="password" id="logPass" class="form-control bg-dark text-white border-secondary" placeholder="••••••••">
      </div>
      <button class="btn btn-primary w-100 py-2 fw-bold shadow" onclick="iniciarSesion()">Ingresar al Panel</button>
    </div>

    <!-- Vista Estudiante (Próxima fase) -->
    <div id="form-estudiante" style="display:none;" class="text-center py-3">
      <p class="text-secondary">Próximamente: Consulta de asistencias y carnet del estudiante.</p>
    </div>

    <div id="login-msg" class="mt-3 text-center"></div>
  </div>

  <!-- PANTALLA 2: PANEL DEL REGENTE -->
  <div id="vista-panel" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="m-0 text-info fw-bold" id="saludoRegente">Panel del Regente</h5>
      <button class="btn btn-sm btn-outline-danger" onclick="cerrarSesion()">Salir</button>
    </div>

    <!-- Pestañas -->
    <ul class="nav nav-pills mb-3 nav-justified" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-escaner" onclick="iniciarCamara()">📷 Escáner</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-gestion" onclick="detenerCamara()">👨‍🎓 Registrar Alumno</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-perfil" onclick="detenerCamara()">⚙️ Ajustes</button>
      </li>
    </ul>

    <div class="tab-content">
      
      <!-- TAB 1: ESCÁNER EN VIVO -->
      <div class="tab-pane fade show active card card-custom p-3 text-center" id="tab-escaner">
        <h6 class="text-secondary mb-2">Apunta la cámara al carnet QR</h6>
        <div id="reader" class="shadow"></div>
        <div id="estado-escaneo" class="box-estado mt-3 p-2 bg-dark border border-secondary text-warning">
          Esperando código QR...
        </div>
      </div>

      <!-- TAB 2: REGISTRO DE ESTUDIANTES CON CURSOS PREDEFINIDOS -->
      <div class="tab-pane fade card card-custom p-4" id="tab-gestion">
        <h5 class="fw-bold text-info mb-3">Inscribir Nuevo Estudiante</h5>
        
        <div class="mb-3">
          <label class="form-label text-light small">Código de Carnet / QR (único)</label>
          <input type="text" id="estId" class="form-control bg-dark text-white border-secondary" placeholder="Ej: 58634568">
        </div>

        <div class="mb-3">
          <label class="form-label text-light small">Nombres</label>
          <input type="text" id="estNombres" class="form-control bg-dark text-white border-secondary" placeholder="Ej: Diego">
        </div>

        <div class="mb-3">
          <label class="form-label text-light small">Apellidos</label>
          <input type="text" id="estApellidos" class="form-control bg-dark text-white border-secondary" placeholder="Ej: Valeriano">
        </div>

        <div class="mb-4">
          <label class="form-label text-light small">Curso</label>
          <select id="selectCurso" class="form-select bg-dark text-white border-secondary">
            <option value="">Seleccione el curso...</option>
            <optgroup label="1ros de Secundaria">
              <option value='1 "A"'>1 "A"</option>
              <option value='1 "B"'>1 "B"</option>
              <option value='1 "C"'>1 "C"</option>
              <option value='1 "D"'>1 "D"</option>
            </optgroup>
            <optgroup label="2dos de Secundaria">
              <option value='2 "A"'>2 "A"</option>
              <option value='2 "B"'>2 "B"</option>
              <option value='2 "C"'>2 "C"</option>
              <option value='2 "D"'>2 "D"</option>
            </optgroup>
            <optgroup label="3ros de Secundaria">
              <option value='3 "A"'>3 "A"</option>
              <option value='3 "B"'>3 "B"</option>
              <option value='3 "C"'>3 "C"</option>
              <option value='3 "D"'>3 "D"</option>
            </optgroup>
            <optgroup label="4tos de Secundaria">
              <option value='4 "A"'>4 "A"</option>
              <option value='4 "B"'>4 "B"</option>
              <option value='4 "C"'>4 "C"</option>
            </optgroup>
            <optgroup label="5tos de Secundaria">
              <option value='5 "A"'>5 "A"</option>
              <option value='5 "B"'>5 "B"</option>
              <option value='5 "C"'>5 "C"</option>
            </optgroup>
            <optgroup label="6tos de Secundaria">
              <option value='6 "A"'>6 "A"</option>
              <option value='6 "B"'>6 "B"</option>
              <option value='6 "C"'>6 "C"</option>
            </optgroup>
          </select>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-bold shadow" onclick="guardarEstudiante()">Guardar Estudiante</button>
        <div id="gestion-msg" class="mt-3 text-center"></div>
      </div>

      <!-- TAB 3: CAMBIO DE CONTRASEÑA -->
      <div class="tab-pane fade card card-custom p-4" id="tab-perfil">
        <h5 class="fw-bold text-info mb-3">Cambiar Mi Contraseña</h5>
        <div class="mb-3">
          <label class="form-label text-light small">Nueva Contraseña</label>
          <input type="password" id="nuevaPass" class="form-control bg-dark text-white border-secondary" placeholder="Mínimo 4 caracteres">
        </div>
        <button class="btn btn-warning w-100 fw-bold py-2" onclick="actualizarContrasena()">Actualizar Contraseña</button>
        <div id="perfil-msg" class="mt-3 text-center"></div>
      </div>

    </div>
  </div>

</div>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyV16aq3IGB3JrnHeEx6F_wU0Ro71a2Djik-CuXSDBosMcr1Tg5anmBBGuEB5xqnsYm/exec";
  let usuarioActual = "";
  let html5QrCode = null;

  // Comunicación con Google Sheets (JSONP)
  function llamarAPI(params, callback) {
    const cbName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    window[cbName] = function(res) {
      delete window[cbName];
      const s = document.getElementById(cbName);
      if(s) s.remove();
      callback(res);
    };

    let query = `callback=${cbName}&t=${Date.now()}`;
    for (let key in params) {
      query += `&${key}=${encodeURIComponent(params[key])}`;
    }

    const script = document.createElement("script");
    script.id = cbName;
    script.src = `${API_URL}?${query}`;
    script.onerror = function() {
      callback({ success: false, mensaje: "Error de red con Google Sheets" });
    };
    document.body.appendChild(script);
  }

  function toggleRol(rol) {
    document.getElementById("form-regente").style.display = (rol === 'regente') ? 'block' : 'none';
    document.getElementById("form-estudiante").style.display = (rol === 'estudiante') ? 'block' : 'none';
  }

  function iniciarSesion() {
    const user = document.getElementById("logUsuario").value.trim();
    const pass = document.getElementById("logPass").value.trim();
    const msg = document.getElementById("login-msg");

    if(!user || !pass) return msg.innerHTML = '<span class="text-danger">Completa todos los campos</span>';
    msg.innerHTML = '<span class="text-info">Validando credenciales...</span>';

    llamarAPI({ action: "login", usuario: user, password: pass }, function(res) {
      if(res.success) {
        usuarioActual = res.usuario;
        document.getElementById("saludoRegente").innerText = "Hola, " + res.nombre;
        document.getElementById("vista-login").style.display = "none";
        document.getElementById("vista-panel").style.display = "block";
        setTimeout(iniciarCamara, 300);
      } else {
        msg.innerHTML = `<span class="text-danger">${res.mensaje}</span>`;
      }
    });
  }

  function cerrarSesion() {
    detenerCamara();
    usuarioActual = "";
    document.getElementById("vista-panel").style.display = "none";
    document.getElementById("vista-login").style.display = "block";
  }

  // --- CÁMARA & ESCÁNER ---
  function sonarBip() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  function iniciarCamara() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }
    if (html5QrCode.isScanning) return;

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 250, height: 250 } },
      alDetectarQR,
      () => {}
    ).then(() => {
      document.getElementById("estado-escaneo").innerHTML = "Apunta al código QR del carnet...";
    }).catch(err => {
      document.getElementById("estado-escaneo").className = "box-estado mt-3 p-2 bg-danger text-white";
      document.getElementById("estado-escaneo").innerHTML = "Permite el acceso a la cámara en el navegador.";
    });
  }

  function detenerCamara() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().catch(() => {});
    }
  }

  let ultimoCodigo = "";
  let tiempoUltimo = 0;

  function alDetectarQR(codigo) {
    const ahora = Date.now();
    if (codigo === ultimoCodigo && (ahora - tiempoUltimo) < 4000) return;
    ultimoCodigo = codigo;
    tiempoUltimo = ahora;

    sonarBip();
    const div = document.getElementById("estado-escaneo");
    div.className = "box-estado mt-3 p-2 bg-primary text-white";
    div.innerHTML = "⏳ Registrando: " + codigo + "...";

    llamarAPI({ action: "asistencia", id: codigo }, function(res) {
      if(res.success) {
        div.className = "box-estado mt-3 p-2 bg-success text-white";
        div.innerHTML = "✅ " + res.mensaje;
      } else {
        div.className = "box-estado mt-3 p-2 bg-warning text-dark";
        div.innerHTML = "⚠️ " + res.mensaje;
      }
    });
  }

  // --- REGISTRO DE ESTUDIANTES ---
  function guardarEstudiante() {
    const datos = {
      action: "guardarEstudiante",
      id: document.getElementById("estId").value.trim(),
      nombres: document.getElementById("estNombres").value.trim(),
      apellidos: document.getElementById("estApellidos").value.trim(),
      curso: document.getElementById("selectCurso").value
    };

    if(!datos.id || !datos.nombres || !datos.apellidos || !datos.curso) {
      return alert("Por favor completa todos los campos (incluyendo la selección de curso)");
    }

    const msg = document.getElementById("gestion-msg");
    msg.innerHTML = '<span class="text-info">Guardando en Google Sheets...</span>';

    llamarAPI(datos, function(res) {
      if(res.success) {
        msg.innerHTML = `<div class="alert alert-success m-0">✅ ${res.mensaje}</div>`;
        document.getElementById("estId").value = "";
        document.getElementById("estNombres").value = "";
        document.getElementById("estApellidos").value = "";
        document.getElementById("selectCurso").value = "";
      } else {
        msg.innerHTML = `<div class="alert alert-danger m-0">⚠️ ${res.mensaje}</div>`;
      }
    });
  }

  // --- CAMBIO DE CONTRASEÑA ---
  function actualizarContrasena() {
    const pass = document.getElementById("nuevaPass").value.trim();
    if(pass.length < 4) return alert("La contraseña debe tener al menos 4 caracteres");

    llamarAPI({ action: "cambiarPass", usuario: usuarioActual, nuevaPass: pass }, function(res) {
      const msg = document.getElementById("perfil-msg");
      msg.innerHTML = `<div class="${res.success ? 'alert alert-success' : 'alert alert-danger'} m-0">${res.mensaje}</div>`;
      document.getElementById("nuevaPass").value = "";
    });
  }
</script>

</body>
</html>
