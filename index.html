<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Asistencia QR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #0b1120; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
    #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 3px solid #38bdf8; }
    .box-estado { min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; font-weight: bold; border-radius: 12px; }
  </style>
</head>
<body class="p-3">

<div class="container" style="max-width: 500px;">
  <h4 class="fw-bold text-info mt-2">📷 Escáner en Vivo</h4>
  <p class="text-secondary small">Control de Asistencia Estudiantil</p>

  <!-- Visor de la cámara -->
  <div id="reader" class="shadow"></div>

  <!-- Cuadro de estado -->
  <div id="estado" class="box-estado mt-3 p-3 bg-dark border border-secondary text-warning">
    Iniciando cámara...
  </div>
</div>

<script>
  // Tu URL oficial de Google Apps Script ya integrada para cualquier dispositivo
  const API_URL = "https://script.google.com/macros/s/AKfycbyV16aq3IGB3JrnHeEx6F_wU0Ro71a2Djik-CuXSDBosMcr1Tg5anmBBGuEB5xqnsYm/exec";

  function sonarBip() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  // Función global para recibir la respuesta de Google
  window.respuestaGoogle = function(data) {
    const div = document.getElementById("estado");
    if(data.success) {
      div.className = "box-estado mt-3 p-3 bg-success text-white";
      div.innerHTML = "✅ " + data.mensaje;
    } else {
      div.className = "box-estado mt-3 p-3 bg-warning text-dark";
      div.innerHTML = "⚠️ " + data.mensaje;
    }
  };

  let ultimoCodigo = "";
  let tiempoUltimo = 0;

  function alEscanear(codigo) {
    const ahora = Date.now();
    // Evitar lecturas repetidas en menos de 4 segundos
    if (codigo === ultimoCodigo && (ahora - tiempoUltimo) < 4000) return;
    ultimoCodigo = codigo;
    tiempoUltimo = ahora;

    sonarBip();
    const div = document.getElementById("estado");
    div.className = "box-estado mt-3 p-3 bg-primary text-white";
    div.innerHTML = "⏳ Registrando: " + codigo + "...";

    // Enviar a Google Sheets mediante JSONP
    const viejoScript = document.getElementById("script-jsonp");
    if (viejoScript) viejoScript.remove();

    const script = document.createElement("script");
    script.id = "script-jsonp";
    script.src = `${API_URL}?id=${encodeURIComponent(codigo)}&callback=respuestaGoogle&t=${Date.now()}`;
    script.onerror = function() {
      div.className = "box-estado mt-3 p-3 bg-danger text-white";
      div.innerHTML = "Error al conectar con Google Sheets";
    };
    document.body.appendChild(script);
  }

  // Encender cámara trasera
  const html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: { width: 250, height: 250 } },
    alEscanear,
    () => {}
  ).then(() => {
    document.getElementById("estado").innerHTML = "Apunta al código QR del carnet...";
  }).catch(err => {
    document.getElementById("estado").className = "box-estado mt-3 p-3 bg-danger text-white";
    document.getElementById("estado").innerHTML = "Error al abrir cámara: Asegúrate de dar permisos en el navegador.";
  });
</script>

</body>
</html>
